name: Deploy Finance (finance.dashboard-eg.com)

# Uploads ONLY the finance/ folder into the subdomain's own folder on Hostinger.
# It cd's into that folder first and aborts if it doesn't exist, so it can never write anywhere else.
# No --delete: nothing on the server is ever removed (runtime data in storage/ is safe).

on:
  push:
    branches: [main]
    paths: ['finance/**', '.github/workflows/deploy-finance.yml']
  workflow_dispatch:

concurrency:
  group: ftp-deploy-finance
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check target folder (must end in /finance)
        env:
          FIN_DIR: ${{ secrets.FINANCE_FTP_DIR }}
        run: |
          DIR="$(printf '%s' "$FIN_DIR" | tr -d '[:space:]')"
          DIR="${DIR%/}"
          if [ -z "$DIR" ]; then echo "::error::FINANCE_FTP_DIR secret is empty."; exit 1; fi
          if [ "$(basename "$DIR")" != "finance" ]; then
            echo "::error::FINANCE_FTP_DIR must point to the finance folder itself (its last part must be 'finance'). Refusing to deploy."
            exit 1
          fi
          echo "FIN_DIR_CLEAN=$DIR" >> "$GITHUB_ENV"

      - name: Lint PHP
        run: for f in finance/*.php; do php -l "$f"; done

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload finance/ via FTP
        env:
          FTP_HOST: ${{ secrets.FINANCE_FTP_SERVER || secrets.FTP_SERVER || secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FINANCE_FTP_USERNAME || secrets.FTP_USERNAME || secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FINANCE_FTP_PASSWORD || secrets.FTP_PASSWORD || secrets.FTP_PASS }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set ftp:passive-mode on
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:timeout 30
          cd "$FIN_DIR_CLEAN"
          mirror -R --verbose --parallel=2 \
            --exclude-glob .DS_Store --exclude ^storage/ \
            ./finance/ ./
          quit
          EOF

      - name: Show what the FTP account can see (only if the folder was not found)
        if: failure()
        env:
          FTP_HOST: ${{ secrets.FINANCE_FTP_SERVER || secrets.FTP_SERVER || secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FINANCE_FTP_USERNAME || secrets.FTP_USERNAME || secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FINANCE_FTP_PASSWORD || secrets.FTP_PASSWORD || secrets.FTP_PASS }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF || true
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set ftp:passive-mode on
          echo "--- FTP root:"
          pwd
          cls -1 --classify
          echo "--- one level down:"
          cls -1 --classify */
          quit
          EOF
