name: Deploy Finance (finance.dashboard-eg.com)

# Uploads ONLY the finance/ folder into the subdomain's own folder on Hostinger.
# It cd's into that folder first and aborts if it doesn't exist, so it can never write anywhere else.
# No --delete: nothing on the server is ever removed (runtime data in storage/ is safe).

on:
  push:
    branches: [main]
    paths: ['finance/**', '.github/workflows/deploy-finance.yml']
  workflow_dispatch:

concurrency:
  group: ftp-deploy-finance
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read target folder setting
        env:
          FIN_DIR: ${{ secrets.FINANCE_FTP_DIR }}
        run: |
          # Optional. If set, its last part MUST be "finance". If empty or "/", the folder is auto-discovered.
          DIR="$(printf '%s' "$FIN_DIR" | tr -d '[:space:]')"; DIR="${DIR%/}"
          if [ -n "$DIR" ] && [ "$(basename "$DIR")" != "finance" ]; then
            echo "::error::FINANCE_FTP_DIR must end in /finance (or be '/' to auto-detect). Refusing to deploy."; exit 1
          fi
          echo "FIN_DIR_CLEAN=$DIR" >> "$GITHUB_ENV"

      - name: Lint PHP
        run: for f in finance/*.php; do php -l "$f"; done

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload finance/ via FTP (only into a folder named "finance")
        env:
          FTP_HOST: ${{ secrets.FINANCE_FTP_SERVER || secrets.FTP_SERVER || secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FINANCE_FTP_USERNAME || secrets.FTP_USERNAME || secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FINANCE_FTP_PASSWORD || secrets.FTP_PASSWORD || secrets.FTP_PASS }}
        run: |
          ftp() { lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; set ftp:passive-mode on; set net:max-retries 3; set net:timeout 30; $1; quit"; }
          if [ -n "$FIN_DIR_CLEAN" ]; then CANDIDATES="$FIN_DIR_CLEAN"; else
            CANDIDATES="domains/dashboard-eg.com/public_html/finance public_html/finance finance domains/finance.dashboard-eg.com/public_html/finance"; fi
          TARGET=""
          for c in $CANDIDATES; do
            if ftp "cd \"$c\"" >/dev/null 2>&1; then TARGET="$c"; break; fi
          done
          if [ -z "$TARGET" ]; then echo "::error::Could not find the finance folder. Tried: $CANDIDATES"; exit 1; fi
          case "$TARGET" in */finance|finance) ;; *) echo "::error::Refusing: $TARGET is not a finance folder"; exit 1;; esac
          echo "Deploying into: $TARGET"
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set ftp:passive-mode on
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:timeout 30
          cd "$TARGET"
          mirror -R --verbose --parallel=2 \
            --exclude-glob .DS_Store --exclude ^storage/ \
            ./finance/ ./
          quit
          EOF

      - name: Show what the FTP account can see (only if the folder was not found)
        if: failure()
        env:
          FTP_HOST: ${{ secrets.FINANCE_FTP_SERVER || secrets.FTP_SERVER || secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FINANCE_FTP_USERNAME || secrets.FTP_USERNAME || secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FINANCE_FTP_PASSWORD || secrets.FTP_PASSWORD || secrets.FTP_PASS }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF || true
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set ftp:passive-mode on
          echo "--- FTP root:"
          pwd
          cls -1 --classify
          echo "--- one level down:"
          cls -1 --classify */ domains/*/ domains/*/public_html/
          quit
          EOF
